<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Our Menu</h1>
    <div class="cards">
        <div class="card">
            <img src="domoda.jpg" alt="domoda stew">
            <h2>Domoda</h2>
            <p>Groundnut stew meat and vegetables, and rice</p>
            <p class="price ">D 250</p>
            <button class="button">Order</button>
        </div>

        <div class="card">
            <img src="benachin.jpg" alt="benachin one-pot">
            <h2>Benachin</h2>
            <p>One-pot rice cooked in tomato and spice</p>
            <p class="price">D 200</p>
            <button class="button">Order</button>
        </div>

        <div class="card">
            <img src="yassa.jpg" alt="">
            <h2>Chicken Yassa</h2>
            <p>Chicken in a lemon and onion sause, with rice</p>
            <p class="price">D 300</p>
            <button class="button">Order</button>
        </div>
    </div>
</body>

</html>
